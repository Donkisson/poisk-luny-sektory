<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142721">
<title>Секторы поиска Луны · Минск</title>
<link rel="stylesheet" href="assets/map.css">
<link rel="stylesheet" href="styles.css">
<script defer src="assets/map.js"></script>
<script defer src="assets/basemap.js"></script>
<script defer src="assets/sectors.js"></script>
<script defer src="config.js"></script>
<script defer src="model.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header class="hero">
  <div class="wrap hero-inner">
    <div>
      <p class="event-label" id="event-label">Минск · суббота, 21 ноября</p>
      <h1>Секторы поиска Луны</h1>
      <p class="intro" id="intro">Выбери участок и сообщи координатору, когда сможешь его проверить.</p>
    </div>
    <a class="back-link" href="https://donkisson.github.io/poisk-luny/">Основная карта поиска</a>
  </div>
</header>
<main class="wrap">
  <section id="coordinator-tools" class="coordinator-tools" hidden aria-label="Управление расписанием">
    <div><strong>Редактор координатора</strong><p id="editor-message" role="status">Контакты хранятся в этом браузере.</p></div>
    <div class="tool-buttons">
      <button type="button" id="export-sheet">Скопировать для Google Таблицы</button>
      <button type="button" id="export-csv">Скачать schedule.csv</button>
      <button type="button" id="export-backup">Сохранить личную копию</button>
      <label class="button file-button">Загрузить личную копию<input id="import-backup" type="file" accept=".json,application/json"></label>
    </div>
  </section>
  <section class="dashboard" aria-label="Карта и расписание">
    <div class="map-panel">
      <div class="panel-head">
        <div><h2>Карта участков</h2><p id="sync-status" role="status">Загружаем расписание…</p></div>
        <div class="map-actions">
          <button type="button" id="west-view">Запад Минска</button>
          <button type="button" id="city-view">Весь Минск</button>
          <button type="button" id="refresh" title="Обновить расписание" aria-label="Обновить расписание">Обновить</button>
        </div>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Фильтр участков"></div>
      <div id="map" role="region" aria-label="Карта Минска с участками поиска"></div>
      <p class="map-note" id="map-note" role="status">Масштаб меняется кнопками на карте или двумя пальцами.</p>
    </div>
    <aside class="side" aria-label="Сведения об участках">
      <div class="side-inner">
        <div id="detail" tabindex="-1"></div>
        <div class="sector-search">
          <label for="sector-query">Найти по номеру участка</label>
          <input type="search" spellcheck="false" id="sector-query" placeholder="Например, 246">
          <div id="sector-list" class="sector-list"></div>
        </div>
      </div>
    </aside>
  </section>
</main>
<noscript><p class="wrap">Включи JavaScript, чтобы открылась карта и расписание.</p></noscript>
</body>
</html>
